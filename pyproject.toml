[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle_dynamics_research"
version = "0.1.0"
description = "Learned vehicle dynamics and sim-to-real research pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["."]